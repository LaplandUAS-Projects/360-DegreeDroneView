<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="utf-8" />
    <title>GoPro Street View</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.min.css" />

    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; display: flex; flex-direction: column; }
        #viewer { flex-grow: 1; background-color: #222; }
        #footer { flex-shrink: 0; display: flex; height: 25vh; }
        #map { flex-grow: 1; }
        #controls { background: #f0f0f0; padding: 10px; border-left: 1px solid #ccc; display: flex; align-items: center; justify-content: center; }
        button { font-size: 1.2em; padding: 10px 20px; margin: 0 10px; cursor: pointer; }
        .psv-marker--tooltip-target { display: none; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div id="footer">
        <div id="map"></div>
        <div id="controls">
            <button id="prev-btn" disabled>&larr; Edellinen</button>
            <button id="next-btn" disabled>Seuraava &rarr;</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.157.0/build/three.module.js",
                "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.min.js",
                "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.module.js"
            }
        }
    </script>
    <script type="module">
        // KORJATTU IMPORT-LAUSEKE
        import { Viewer } from '@photo-sphere-viewer/core';
        import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

        let data = [];
        let currentIndex = 0;
        let map, marker, viewer, markersPlugin;

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        function updateControls() {
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex === data.length - 1;
        }

        function updateView() {
            const item = data[currentIndex];
            viewer.setPanorama('frames/' + item.image).then(() => {
                markersPlugin.clearMarkers();
                if (currentIndex < data.length - 1) {
                    const nextItem = data[currentIndex + 1];
                    markersPlugin.addMarker({
                        id: 'forward-arrow',
                        position: { yaw: nextItem.yaw, pitch: -0.2 },
                        image: 'arrow-forward.svg',
                        size: { width: 120, height: 120 },
                        anchor: 'center center',
                    });
                }
                if (currentIndex > 0) {
                    markersPlugin.addMarker({
                        id: 'backward-arrow',
                        position: { yaw: (item.yaw + Math.PI), pitch: -0.2 },
                        image: 'arrow-backward.svg',
                        size: { width: 100, height: 100 },
                        anchor: 'center center',
                    });
                }
            }).catch(e => console.error('Kuvan lataus epäonnistui:', e));

            map.setView([item.lat, item.lon], 18);
            marker.setLatLng([item.lat, item.lon]);
            updateControls();
        }

        fetch('data.json')
            .then(res => res.json())
            .then(jsonData => {
                data = jsonData;
                if (!data || !data.length) return alert("data.json on tyhjä!");
                
                const firstPoint = data[0];
                map = L.map('map').setView([firstPoint.lat, firstPoint.lon], 18);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
                marker = L.marker([firstPoint.lat, firstPoint.lon]).addTo(map);

                viewer = new Viewer({
                    container: 'viewer',
                    panorama: 'frames/' + firstPoint.image,
                    loadingImg: 'https://photo-sphere-viewer.js.org/assets/loader.gif',
                    navbar: ['zoom', 'fullscreen'],
                    plugins: [[MarkersPlugin, {}]]
                });

                markersPlugin = viewer.getPlugin(MarkersPlugin);
                markersPlugin.addEventListener('select-marker', ({ marker }) => {
                    if (marker.id === 'forward-arrow') nextBtn.click();
                    else if (marker.id === 'backward-arrow') prevBtn.click();
                });

                prevBtn.addEventListener('click', () => {
                    if (currentIndex > 0) {
                        currentIndex--;
                        updateView();
                    }
                });
                nextBtn.addEventListener('click', () => {
                    if (currentIndex < data.length - 1) {
                        currentIndex++;
                        updateView();
                    }
                });
                updateView();
            })
            .catch(err => alert("Datan lataus epäonnistui: " + err));
    </script>
</body>
</html>
